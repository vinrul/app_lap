server {
    listen 80;
    listen [::]:80;
    server_name laporan.example.go.id;

    # Backend membatasi unggahan 32 MB + overhead multipart.
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;

        # WAJIB. Middleware require_local_host menolak Host non-loopback.
        # Jangan diganti menjadi $host; login/API akan dibalas 403.
        proxy_set_header Host 127.0.0.1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pembuatan PDF lewat Chrome bisa memakan waktu.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
