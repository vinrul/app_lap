[package]
name = "laporan_mingguan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["rand_core"] }
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
calamine = "0.37.0"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.0", features = ["full"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
